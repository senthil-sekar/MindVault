[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# Correctness rules only. Whitespace/style rules would flag ~600 pre-existing
# lines and drown out real findings; run `ruff check --select W,I --fix` if you
# ever want that cleanup as its own commit.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]  # FastAPI dependency defaults
